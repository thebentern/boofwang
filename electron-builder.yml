# SPDX-License-Identifier: GPL-3.0-or-later
#
# Packaging for the desktop shell.
#
# The app is a static site plus two small files, so what gets packaged is
# deliberately tiny: `electron/` and the generated site, and nothing else. There
# are no runtime node dependencies to carry - every dependency in package.json
# is a build-time one - so `node_modules` is excluded outright rather than
# pruned, which is both smaller and easier to reason about.
#
# Signing is decided in scripts/desktop-build.mjs, not here. macOS is signed
# with a Developer ID certificate and notarized when the credentials are in the
# environment; Windows has no certificate and is not signed. Keeping that branch
# in the build script rather than in this file is what lets a contributor
# without a certificate package the app - see docs/signing.md.
appId: ng.boofwa.desktop
productName: boofwang
copyright: GPL-3.0-or-later

directories:
  output: dist-desktop
  buildResources: build

# Named explicitly rather than left to the convention. electron-builder would
# find `build/icon.*` on its own, and has been known to silently ship its own
# default when one is missing - a build with the Electron logo on it is the kind
# of thing nobody notices until it is on a release page.
icon: build/icon.png

# Only what the shell needs. `.output/public` is mapped into resources/site,
# which is where `main.mjs` looks when `app.isPackaged`.
files:
  - electron/**/*
  - package.json
extraResources:
  - from: .output/public
    to: site

# Every target is a plain archive. The zip was chosen while builds were
# unsigned, because Gatekeeper's quarantine message on a mounted .dmg is the one
# that offers no way forward. Now that macOS is signed and notarized that reason
# has gone and a .dmg would be the friendlier download - it stays a zip because
# renaming the artifact breaks existing links, not because the old reason holds.
mac:
  icon: build/icon.icns
  target:
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.utilities
  # The shell asks for no protected resources of its own. Serial and Bluetooth
  # are reached through Chromium, which is covered by the entitlements below.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Turned on by scripts/desktop-build.mjs whenever a certificate is present:
  # notarization requires it, and it does nothing without a signature. False
  # here so that an unsigned local build does not claim a runtime it has not
  # been hardened against.
  hardenedRuntime: false

win:
  icon: build/icon.ico
  target:
    - target: zip
      arch: [x64]

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: HamRadio
  # A serial cable on Linux is a group-permissions question before it is a
  # software one. Said in the release notes rather than attempted here.
  synopsis: Program two-way radios over a cable or Bluetooth

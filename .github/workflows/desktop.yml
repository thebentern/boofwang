# SPDX-License-Identifier: GPL-3.0-or-later
name: Desktop

# Tag-driven, plus a manual button. The web app deploys from `main` on every
# push; the desktop build is a thing somebody downloads and keeps, so it is cut
# deliberately rather than continuously.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Called by the Release workflow, which pushes the tag itself. A tag pushed
  # with GITHUB_TOKEN does not fire the `push` trigger above - GitHub blocks
  # that so runs cannot recurse - so the release path has to arrive here
  # directly rather than through the tag.
  workflow_call:
    inputs:
      tag:
        description: Tag to build from and attach the archives to
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others built. A release
      # with two of three archives and an honest note beats no release at all.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag when Release called us, the triggering ref otherwise.
          # Building `main` while attaching to a tag would ship archives that
          # are not what the tag points at.
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate the web build passes. A desktop archive is harder to
      # replace than a deploy, so it does not skip the checks.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: node scripts/check-headers.mjs

      # `/` rather than the Pages sub-path: the shell serves the site at the
      # root of its own scheme.
      - run: pnpm nuxt generate
        env:
          NUXT_APP_BASE_URL: /

      # The icons are committed because only macOS has `iconutil`, so a build
      # cannot regenerate them. This catches the case where the SVG moved and
      # the icons did not - a release with a stale icon is not a thing anybody
      # notices until it is published.
      - run: pnpm icons:check
        if: runner.os == 'macOS'

      # electron-builder wants a *path* to the .p8, not its contents, so the
      # secret holds base64 and this writes the file. Outside the workspace, so
      # a stray `actions/upload-artifact` glob can never pick it up.
      - name: Stage the notarization key
        id: apple_key
        if: runner.os == 'macOS'
        shell: bash
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # Branching in the shell rather than in `if:`, because the `secrets`
          # context is not dependably available in a step condition and the
          # failure mode is a step that silently never runs.
          if [ -z "${KEY_B64:-}" ]; then
            echo "no APPLE_API_KEY_BASE64: this build will not be notarized"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key="${RUNNER_TEMP}/apple-api-key.p8"
          printf '%s' "$KEY_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "path=$key" >> "$GITHUB_OUTPUT"

      - name: Package
        run: node scripts/desktop-build.mjs
        env:
          # Absent on a fork and on any run where the secrets have not been
          # added: the build is then unsigned and says so in its own log, which
          # is the state every release has shipped in so far.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 || (runner.os == 'Windows' && secrets.WIN_CERT_PFX || '') }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || (runner.os == 'Windows' && secrets.WIN_CERT_PASSWORD || '') }}
          # Notarization, App Store Connect API key form. Preferred over an
          # Apple ID because it carries no password and is not tied to somebody's
          # two-factor device.
          APPLE_API_KEY: ${{ steps.apple_key.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: build
    # `always()` because `needs` otherwise requires every matrix job, and this
    # workflow deliberately sets `fail-fast: false` so one platform failing does
    # not hide the others. The first tagged run proved the point: macOS and
    # Linux built, Windows failed the suite, and the release went out with
    # nothing attached at all. Publish what exists and say what is missing.
    #
    # Only a tag makes a release, whether it arrived as a push or as a call from
    # the Release workflow. A plain manual run builds and leaves the archives on
    # the run, which is what you want when checking whether it still builds.
    if: always() && (inputs.tag || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: ls -R artifacts

      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # github.ref_name is the tag on a push, but the caller's branch when
          # Release calls us - so the passed tag has to win where there is one.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \
            \( -name '*.zip' -o -name '*.AppImage' -o -name '*.tar.gz' \) | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No archives were built. Not touching the release." >&2
            exit 1
          fi
          printf 'attaching %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Say which platforms are missing
        if: ${{ needs.build.result != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::At least one platform did not build. The release has only the archives that did."


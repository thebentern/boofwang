// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // usb-serial-for-android is published on JitPack. The plugin module
        // declares this too, next to the pinned version, but that is not
        // enough on its own: Gradle resolves a transitive dependency with the
        // repositories of the project doing the resolving, so :app needs it
        // as well or :app:checkDebugAarMetadata cannot find the .aar that
        // :boofwang-usb-serial compiled against.
        maven { url = "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

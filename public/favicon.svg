<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="boofwang">
  <!--
    A radio tower, matching the wordmark in the nav.

    Drawn on a solid tile rather than as a bare glyph: a 16px stroke on a
    transparent background disappears into whichever tab strip it lands on.
    The tile flips with the browser's theme so the mark keeps its contrast in
    both, and the strokes are heavy enough to survive being scaled to 16px.
  -->
  <style>
    .tile { fill: #171b1e }
    .edge { stroke: #333b41 }
    .mark { stroke: #e8ecee; fill: #e8ecee }
    @media (prefers-color-scheme: light) {
      .tile { fill: #ffffff }
      .edge { stroke: #c6ced4 }
      .mark { stroke: #14191c; fill: #14191c }
    }
  </style>

  <rect class="tile edge" x="0.75" y="0.75" width="30.5" height="30.5" rx="7" stroke-width="1.5"/>

  <g class="mark" fill="none" stroke-width="2.4" stroke-linecap="round">
    <!-- Broadcast arcs, inner pair only: an outer pair turns to mush at 16px. -->
    <path d="M10.4 20.6a8 8 0 0 1 0-9.2"/>
    <path d="M21.6 11.4a8 8 0 0 1 0 9.2"/>
    <!-- Mast, with a splayed foot so it reads as a tower and not an exclamation mark. -->
    <path d="M16 17.4V26"/>
    <path d="M12.6 26h6.8"/>
  </g>
  <circle class="mark" cx="16" cy="13.6" r="2.6" stroke="none"/>
</svg>
